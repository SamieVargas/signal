# Offline tests: the stub-client pipeline test and the eval runner test.
# Nothing here needs an API key or the network beyond package installs;
# ANTHROPIC_API_KEY is deliberately not set so a test that reached for the
# real API would fail here rather than spend credit.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-trace.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-trace.txt pytest
      - name: Offline tests (stub client, no API key)
        run: python -m pytest -q tests/ evals/test_run.py
